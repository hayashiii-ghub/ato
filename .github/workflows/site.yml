name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: site/.bun-version
      - run: bun install --frozen-lockfile
      - name: Audit site dependencies
        run: bun audit --audit-level=high
      - run: bun run check
      - run: bun run test
      - name: Production Cloudflare build
        run: bun run cf:build:production
