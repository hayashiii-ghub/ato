<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>ato? social image</title>
  <link rel="stylesheet" href="../src/style.css">
  <script type="module" src="./ato-og.ts"></script>
  <style>
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { background: #030304; color: #f2f0eb; -webkit-font-smoothing: antialiased; }
  .og-artwork { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .og-brand { position: absolute; top: 24px; left: 46px; height: 44px; }
  .og-brand img { display: block; width: auto; height: 44px; }
  .og-artwork h1 { position: absolute; top: 84px; left: 48px; margin: 0; font: 400 68px/1.08 "Instrument Serif", serif; letter-spacing: -.025em; }
  .og-product { position: absolute; top: 180px; left: 28px; right: 28px; margin: 0; }

  .og-desktop { padding: 8px; border: 1px solid #50555a; border-radius: 22px; background: #0a0c0f; box-shadow: inset 0 1px 2px #a2a5a651; }
  .og-screen { position: relative; width: 100%; aspect-ratio: 1643 / 957; overflow: hidden; border-radius: 14px; }
  .og-backdrop { position: absolute; width: 100%; height: 100%; object-fit: cover; }
  .og-widget { position: absolute; top: 60px; right: 38px; width: 420px; }
  .og-widget .medium-widget { width: 100%; height: 198px; border-radius: 23px; padding: 27px 23px; gap: 12px; background: #2c3735ed; }
</style>
</head>
<body><main class="og-artwork">
  <div class="og-brand"><img src="../public/assets/ato-mark.svg" width="79" height="44" alt="ato?"></div>
  <h1>AI usage widget</h1>
  <figure class="og-product og-desktop"><div class="og-screen">
    <img class="og-backdrop" src="../public/assets/mac-desktop-scene.jpg" width="1643" height="957" alt="">
    <div class="og-widget"><div class="widget medium-widget" data-widget="social"></div></div>
  </div></figure>
</main></body>
</html>
